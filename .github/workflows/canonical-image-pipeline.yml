# The shared canonical image pipeline, on every push.
#
# No JVM and no dataset: everything here is geometry, pixels, PNG containers,
# prepared-set storage and the tampering and failure-injection properties that
# make a prepared-image set evidence rather than a build artefact
# (docs/adr/0031, docs/adr/0033).
#
# Pillow is installed from requirements-imaging.lock rather than from the
# project's ordinary dependencies, because the *pinned* resampler is the thing
# the golden hashes were taken under. A run that resolved a different Pillow
# would still exercise the structure and would skip the byte-exact comparisons,
# which is the wrong kind of green.

name: canonical image pipeline

on:
  push:
  pull_request:

jobs:
  imaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned resampler and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-imaging.lock
          python -m pip install -e ".[dev]"

      - name: Confirm the installed Pillow is the pinned one
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from fpbench.imaging.runtime import (
              dependency_lock_sha256,
              pillow_distribution_fingerprint,
              pillow_zlib_version,
          )
          version, fingerprint, files = pillow_distribution_fingerprint()
          pinned = next(
              line.split("==", 1)[1].strip()
              for line in Path("requirements-imaging.lock").read_text().splitlines()
              if line.strip().startswith("Pillow==")
          )
          print(f"Pillow {version} ({files} files) fingerprint {fingerprint[:16]}")
          print(f"zlib {pillow_zlib_version()}")
          print(f"lock {dependency_lock_sha256()[:16]}")
          assert version == pinned, f"installed {version}, lock pins {pinned}"
          PY

      - name: Geometry, pixels, PNG, runtime, storage, tampering, preparer
        run: pytest -m "imaging and not dataset and not sourceafis" -q

      - name: The transform profile is the one the golden fixtures were taken under
        run: pytest tests/unit/test_transform_profile.py tests/unit/test_canonical_pixels.py -q

      - name: Golden fixtures are committed and unchanged
        # Regenerating must be a deliberate act with a reviewed diff. A fixture
        # that changed because somebody touched the profile is the single most
        # useful signal this project has that canonical pixels moved. The check
        # generates into a temporary directory because the wheel fingerprint
        # and zlib build recorded as provenance are platform-specific.
        run: python tests/fixtures/imaging/generate.py --check

      - name: The synthetic structural chain, end to end
        run: pytest tests/integration/test_canonical_structural.py -q
