name: sourceafis adapter

# Builds the Java bridge from source and runs everything that needs a real JVM and a
# real SourceAFIS 3.18.1 on the classpath: the Java unit tests, the Python adapter
# tests, the generic adapter contract suite, the pinned regression score, and — since
# stage 4B — the runtime-bundle, provenance and research-mode suites plus a synthetic
# end-to-end research run that finalises externally and reaches RESEARCH_READY.
#
# The SD300 smoke test and the 6,000-comparison run are excluded. Both need the NIST
# delivery, which is redistribution-restricted and is not present on a public runner.
#
# Since stage 6A it also runs the canonical-image integration: a real prepared-image
# set, a real Canonical500ImagePreparer, the real Java bridge, and a stored result
# carrying the whole preparation provenance. That seam exists in the 6,000-comparison
# run and needs no restricted data to exercise, so there is no reason to run 6,000
# comparisons in public CI to test it (spec section 104).
#
# Since stage 7A it also runs SourceAFIS through the two things that were made
# generic: the reusable conformance suite, and the shared research engine driven
# by `sourceafis_research_integration()` alone. Forty comparisons through a real
# JVM to RESEARCH_READY — enough to exercise every seam the 6,000-comparison run
# has, and no reason to run 6,000 of them here (spec section 85).

on:
  push:
    paths:
      - "integrations/sourceafis-java/**"
      - "src/fpbench/adapters/sourceafis_java/**"
      - "src/fpbench/adapters/registry.py"
      - "src/fpbench/experiments/**"
      - "src/fpbench/provenance/**"
      - "src/fpbench/core/runtime_models.py"
      - "src/fpbench/core/provenance_models.py"
      - "src/fpbench/core/result_set_models.py"
      - "src/fpbench/core/research_models.py"
      - "src/fpbench/storage/runtime_bundle_store.py"
      - "src/fpbench/storage/result_set_store.py"
      - "src/fpbench/execution/research.py"
      - "src/fpbench/execution/result_set.py"
      - "tests/**sourceafis**"
      - "tests/**research**"
      - "tests/**runtime_bundle**"
      - "tests/**result_set**"
      - "tests/**provenance**"
      - "tests/synthetic_ridges.py"
      - "tests/runworld.py"
      - "tests/canonicalworld.py"
      - "tests/contract/**"
      - "src/fpbench/imaging/**"
      - "src/fpbench/core/imaging_models.py"
      - "src/fpbench/storage/prepared_image_set_store.py"
      - "configs/algorithms/sourceafis*"
      - "configs/execution/**"
      - "configs/experiments/**"
      - ".github/workflows/sourceafis-adapter.yml"
  pull_request:
    paths:
      - "integrations/sourceafis-java/**"
      - "src/fpbench/adapters/sourceafis_java/**"
      - "src/fpbench/adapters/registry.py"
      - "src/fpbench/experiments/**"
      - "src/fpbench/provenance/**"
      - "src/fpbench/core/runtime_models.py"
      - "src/fpbench/core/provenance_models.py"
      - "src/fpbench/core/result_set_models.py"
      - "src/fpbench/core/research_models.py"
      - "src/fpbench/storage/runtime_bundle_store.py"
      - "src/fpbench/storage/result_set_store.py"
      - "src/fpbench/execution/research.py"
      - "src/fpbench/execution/result_set.py"
      - "tests/**sourceafis**"
      - "tests/**research**"
      - "tests/**runtime_bundle**"
      - "tests/**result_set**"
      - "tests/**provenance**"
      - "tests/synthetic_ridges.py"
      - "tests/runworld.py"
      - "tests/canonicalworld.py"
      - "tests/contract/**"
      - "src/fpbench/imaging/**"
      - "src/fpbench/core/imaging_models.py"
      - "src/fpbench/storage/prepared_image_set_store.py"
      - "configs/algorithms/sourceafis*"
      - "configs/execution/**"
      - "configs/experiments/**"
      - ".github/workflows/sourceafis-adapter.yml"

jobs:
  sourceafis:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Turns "the bridge is unavailable" from a skip into a failure. Without this a
      # broken build would produce a green run full of skipped tests.
      FPBENCH_REQUIRE_SOURCEAFIS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and the pinned resampler
        run: |
          pip install -r requirements-imaging.lock
          pip install -e ".[dev]"

      # 17 is the project's reference JVM: the exact version reaches the environment
      # fingerprint, and the pinned regression score is only asserted here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build the Java bridge
        run: >-
          ./integrations/sourceafis-java/mvnw
          --batch-mode
          --file integrations/sourceafis-java/pom.xml
          clean test package

      - name: Confirm the bridge reports SourceAFIS 3.18.1
        run: |
          java -jar integrations/sourceafis-java/target/fpbench-sourceafis-bridge.jar version

      # The provenance machinery does not need a JVM and must hold on a runner
      # whose own checkout is a detached head with no clean-tree guarantee. Each
      # of these builds its own throwaway git repository or its own bundle, so a
      # failure here is a failure of the code rather than of the runner.
      - name: Run the provenance, runtime-bundle and result-set tests
        run: >-
          pytest -q
          tests/unit/test_software_provenance.py
          tests/unit/test_research_environment.py
          tests/unit/test_runtime_bundle_store.py
          tests/unit/test_result_set_store.py
          tests/unit/test_research_status.py
          tests/unit/test_research_finalization_transaction.py
          tests/unit/test_external_finalisation.py
          tests/unit/test_sourceafis_validation.py

      # Includes the generic adapter contract suite, which is parametrised over the
      # registry and so covers SourceAFIS automatically, plus the research-mode
      # adapter tests and the synthetic end-to-end research run.
      - name: Run the SourceAFIS Python tests
        run: pytest -m "sourceafis and not dataset"

      # A canonical artefact, through the real bridge, into a real result. The
      # seam this covers — preparer to adapter to stored preparation provenance —
      # is the one thing the 6,000-comparison run adds that the synthetic
      # structural test cannot reach on its own.
      - name: Run the canonical-image integration
        run: pytest -m "sourceafis and canonical500 and not dataset" -q
