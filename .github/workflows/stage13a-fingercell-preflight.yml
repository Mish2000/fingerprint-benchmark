name: Stage 13A Neurotechnology FingerCell preflight

# What this workflow proves, and what it deliberately does not.
#
# It runs the whole Stage 13A contract — the candidate identity, the ten hard
# gates and the order they run in, the four gate states and the
# ACTION_REQUIRED/FAIL split that separates work nobody has done from findings
# about the candidate, the acquisition manifest and its digest rules, the
# same-vendor contamination guard, the canonical500 route and the refused
# embedded sample size, the single-finger proprietary template rule, the native
# raw integer score contract, the settings closure, the frozen pair binding, the
# four mandatory failure probes, the qualification harness proved end to end
# against a fake SDK, the secret guard, the vendor-byte guard, and a marker that
# can only be FINGERCELL_PREFLIGHT_PASS or FINGERCELL_PREFLIGHT_FAIL.
#
# All of it is pure Python on synthetic fixtures. There is no dataset here, no
# torch, no vendor SDK, no licence, no network and no workspace.
#
# It downloads **nothing** and activates **nothing**. There is no Neurotechnology
# licence, trial token or machine ID in GitHub Secrets for this stage and there
# will not be one: the evaluation environment is local, and a licensed credential
# in a service this project does not control is exactly what this stage refuses.
# Tests that need the delivered archive carry the `fingercell_artifact` marker
# and are not run here.
#
# A green tick here does not say an Algorithm 5 exists. Today it says something
# narrower and exact: the official trial was obtained and pinned by digest, its
# identity and delivered API were read out of the archive, and the stage is
# waiting on a local action — writing and compiling the qualification bridge —
# before the trial clock is ever started (docs/adr/0112, docs/adr/0115).

on:
  push:
    paths:
      - "src/fpbench/core/fingercell_preflight_errors.py"
      - "src/fpbench/experiments/stage13a_*.py"
      - "evidence/stage13a-fingercell-preflight/**"
      - "tests/**stage13a**"
      # Stage 13A binds Stage 12A as its predecessor, Stage 11B as immutable and
      # Stage 8E's policy. A change to any of them changes what this stage's
      # decisions mean, so the stage is re-run rather than trusted.
      - "evidence/stage12a-idkit-preflight/**"
      - "evidence/stage11b-verifinger-canonical500-raw/**"
      - "src/fpbench/third_party/**"
      - "src/fpbench/core/third_party_models.py"
      - "src/fpbench/core/third_party_errors.py"
      - "evidence/stage8e-research-only-policy/**"
      - "docs/adr/011[2-9]*.md"
      - "docs/adr/0120*.md"
      - "docs/algorithms/algorithm5-candidates/**"
      - "docs/experiments/stage13a-fingercell-preflight.md"
      - ".github/workflows/**"
      - ".gitignore"
      - ".gitattributes"
      - "pyproject.toml"
      - "Makefile"
  pull_request:
    paths:
      - "src/fpbench/core/fingercell_preflight_errors.py"
      - "src/fpbench/experiments/stage13a_*.py"
      - "evidence/stage13a-fingercell-preflight/**"
      - "tests/**stage13a**"
      - "evidence/stage12a-idkit-preflight/**"
      - "evidence/stage11b-verifinger-canonical500-raw/**"
      - "src/fpbench/third_party/**"
      - "src/fpbench/core/third_party_models.py"
      - "src/fpbench/core/third_party_errors.py"
      - "evidence/stage8e-research-only-policy/**"
      - "docs/adr/011[2-9]*.md"
      - "docs/adr/0120*.md"
      - "docs/algorithms/algorithm5-candidates/**"
      - "docs/experiments/stage13a-fingercell-preflight.md"
      - ".github/workflows/**"
      - ".gitignore"
      - ".gitattributes"
      - "pyproject.toml"
      - "Makefile"

permissions:
  contents: read

jobs:
  fingercell-preflight-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: The frozen Stage 13A preflight contract
        run: pytest -m "stage13a_contract" -q

      - name: Committed Stage 13A evidence gate
        run: pytest -m "stage13a" -q

      - name: The qualification harness, driven end to end against the fake SDK
        # The one execution this stage can perform without a vendor: every pass,
        # both orientations, SELF from two extractions, a real process restart,
        # and all four mandatory failure probes. It proves the harness before any
        # trial clock is ever started (docs/adr/0115).
        run: |
          python -m fpbench.experiments.stage13a_qualification fake
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from fpbench.experiments import stage13a_fingercell_identity as frozen
          from fpbench.experiments import stage13a_preflight as engine
          from fpbench.experiments import stage13a_qualification as harness

          with tempfile.TemporaryDirectory() as scratch:
              fixtures = harness.build_fixtures(Path(scratch), width=96, height=120)
              record = harness.run_qualification(
                  harness.fake_engine_factory,
                  fixtures,
                  engine_kind=harness.EngineKind.FAKE_SDK,
              )
          assert record.status is frozen.QualificationOutcome.SUCCESS, record.failure_detail
          assert record.scoring_comparisons <= frozen.QUALIFICATION_MAX_SCORING_COMPARISONS
          assert all(record.determinism[level] for level in frozen.DETERMINISM_LEVELS)
          provoked = {
              item["cause"] for item in record.failure_probes if item["behaved_correctly"]
          }
          assert provoked == {cause for cause, _ in frozen.MANDATORY_FAILURE_PROBES}, (
              "all four mandatory failure probes, not a subset"
          )
          assert not any(item["produced_a_score"] for item in record.failure_probes)
          assert record.pair_orientation["score_digests_equal"] is False, (
              "the fake matcher is asymmetric because nothing promises the real one is not"
          )
          assert engine.qualification_record() is None, (
              "a fake record answered a gate, which is the one thing it may never do"
          )
          print("The harness satisfies its own contract, and its record answers no gate.")
          PY

      - name: No FingerCell archive, module or licence material is tracked here
        run: |
          python - <<'PY'
          from pathlib import Path

          from fpbench.experiments.stage13a_acquisition import (
              require_no_fingercell_bytes_in_git,
          )
          from fpbench.third_party import require_no_third_party_bytes_in_git

          generic = require_no_third_party_bytes_in_git(Path("."))
          exact = require_no_fingercell_bytes_in_git(Path("."))
          print(
              f"{generic.tracked_file_count} tracked files scanned against "
              f"{len(generic.rules)} generic rules and the vendor artifact and "
              "licence name rules."
          )
          print(f"Findings: {len(generic.findings)} generic, {len(exact.findings)} exact.")
          PY

      - name: No sibling algorithm is reachable from this stage
        # Stage 13A's own hazard: Algorithm 4 comes from the same vendor, and the
        # delivered FingerCell archive ships common runtime components under the
        # same naming convention. An import is the cheapest way to cross that
        # boundary by accident (docs/adr/0114).
        run: |
          python - <<'PY'
          from pathlib import Path

          from fpbench.core.fingercell_preflight_errors import (
              FingerCellContaminationError,
          )
          from fpbench.experiments.stage13a_preflight import (
              require_no_verifinger_contamination,
          )

          audited = require_no_verifinger_contamination(Path("."))
          print(f"{len(audited)} Stage 13A modules audited; none reaches Algorithm 4.")

          import tempfile

          with tempfile.TemporaryDirectory() as scratch:
              root = Path(scratch)
              module = root / "src" / "fpbench" / "experiments"
              module.mkdir(parents=True)
              (module / "stage13a_fingercell_identity.py").write_text(
                  "from fpbench.adapters." + "verifinger_java import x\n"
              )
              try:
                  require_no_verifinger_contamination(root)
              except FingerCellContaminationError:
                  print("The contamination guard bites when a sibling import appears.")
              else:
                  raise AssertionError("the contamination guard missed a sibling import")
          PY

      - name: No credential is present, and none is published
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from fpbench.experiments.stage13a_finalization import (
              require_no_sensitive_published_data,
          )
          from fpbench.experiments.stage13a_preflight import find_sensitive_material

          leaked = sorted(
              name
              for name in os.environ
              if ("fingercell" in name.lower() or "neurotec" in name.lower())
              and any(
                  part in name.lower()
                  for part in ("key", "secret", "token", "licen", "password", "hwid")
              )
          )
          assert not leaked, f"the runner carries Neurotechnology credentials: {leaked}"

          require_no_sensitive_published_data(Path("."))

          for probe in (
              {"note": "AAAAAAAA-BBBB-CCCC-DDDD-EEEEEEEEEEEE"},
              {"machine_id": "whatever"},
              {"trial_token": "whatever"},
              {"path": "/home/someone/archives"},
          ):
              assert find_sensitive_material(probe), f"the guard missed {probe}"
          print("No credential in the environment, none in the evidence, and the guard bites.")
          PY

      - name: This job has no runtime, no SDK and fetched nothing
        run: |
          python - <<'PY'
          import importlib.util

          for name in ("torch", "torchvision", "numpy", "scipy", "cv2", "sklearn"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed"

          from fpbench.experiments.stage13a_acquisition import acquisition_state

          state = acquisition_state()
          assert state.obtained is False, (
              "a runner has a delivered FingerCell archive, which means something fetched it"
          )
          print(f"No FingerCell archive and no licence is present here: {state.presence.value}. As intended.")
          PY

      - name: The Stage 13A workflow itself downloads and activates nothing
        # The tokens are assembled from halves rather than written out, for the
        # reason every stage since 8E assembles its own: a literal here would
        # make the check refuse the step that performs it.
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/stage13a-fingercell-preflight.yml"
          ).read_text(encoding="utf-8")
          body = workflow.split("jobs:", 1)[1]
          tokens = [
              "secrets." + "FINGERCELL",
              "secrets." + "NEUROTEC",
              "download." + "neurotechnology",
              "licen" + "se_manager",
              "hardware" + "id",
              "w" + "get",
              "cu" + "rl",
              "unz" + "ip",
          ]
          found = sorted(token for token in tokens if token in body)
          assert not found, f"the Stage 13A job body names {found}"
          print(f"None of {len(tokens)} acquisition or activation tokens appears in this job.")
          PY

      - name: No SD300 path and no prior algorithm's scores are reachable
        run: |
          python - <<'PY'
          import os

          assert not os.environ.get("FPBENCH_SD300_ROOT"), (
              "the dataset root is set for a stage that must not read it"
          )

          from fpbench.experiments import stage13a_preflight as engine

          preflight = engine.run_preflight()
          print(f"{preflight.outcome}")
          for result in preflight.results:
              print(f"  {result.gate.value}: {result.status.value}")
          PY

      - name: An incomplete preflight writes no marker
        # The invariant that keeps "not done yet" from becoming a published
        # verdict. On a runner with no archive the run stops at the acquisition
        # gate, and the publisher must refuse a marker rather than write a FAIL
        # about a candidate nobody tested (docs/adr/0112).
        run: |
          python - <<'PY'
          from pathlib import Path

          from fpbench.core.fingercell_preflight_errors import Stage13AFinalizationError
          from fpbench.experiments import stage13a_fingercell_identity as frozen
          from fpbench.experiments import stage13a_preflight as engine
          from fpbench.experiments.stage13a_finalization import write_stage13a_evidence

          preflight = engine.run_preflight()
          assert preflight.outcome == frozen.STAGE_13A_INCOMPLETE_OUTCOME, preflight.outcome
          assert preflight.failure_class is None
          assert not preflight.blockers
          assert preflight.opens_stage_13b is False
          assert preflight.reopens_algorithm_5_search is False

          try:
              write_stage13a_evidence(Path("."), include_marker=True)
          except Stage13AFinalizationError as exc:
              assert "outstanding" in str(exc)
              print("The publisher refuses a marker while a local action is outstanding.")
          else:
              raise AssertionError("a marker was written for an incomplete preflight")

          marker = Path("evidence/stage13a-fingercell-preflight/stage-13a-finalization.json")
          assert not marker.is_file(), "an incomplete Stage 13A published a marker"
          PY

      - name: Stage 12A, Stage 11B and Stage 8E are bound and unchanged
        run: |
          pytest -m "stage12a_contract or stage12a" -q
          pytest -m "stage11b_contract or stage11b" -q
          pytest -m "stage11a_contract or stage11a" -q
          pytest -m "stage8e_contract or stage8e" -q
          python - <<'PY'
          from pathlib import Path

          from fpbench.experiments.stage13a_preflight import (
              require_stage11b_is_unchanged,
              require_stage12a_is_the_closed_predecessor,
              require_stage8e_is_the_policy_this_reuses,
          )

          require_stage8e_is_the_policy_this_reuses(Path("."))
          predecessor = require_stage12a_is_the_closed_predecessor(Path("."))
          eleven_b = require_stage11b_is_unchanged(Path("."))
          print(f"Stage 12A is closed at {predecessor}, and it still opens the Algorithm 5 slot.")
          print(f"Stage 11B is unchanged at {eleven_b}.")
          PY

      - name: Regression suites for the prior stages
        run: |
          pytest -m "stage10a_contract or stage10a" -q
          pytest -m "stage10b_contract or stage10b" -q
          pytest -m "stage9a_contract or stage9a" -q
          pytest -m "stage8a_contract or stage8a" -q
          pytest -m "stage8b_contract or stage8b" -q
          pytest -m "stage8c_contract or stage8c" -q
          pytest -m "stage8d_contract or stage8d" -q
          pytest -m "decisions or metrics or imaging or paired_evaluation" -q
          pytest -m "(adapter_contract or nbis_contract) and not dataset" -q

      - name: The outcome, and what it does and does not say
        run: |
          python -m fpbench.experiments.stage13a_finalization status
          python - <<'PY'
          print()
          print("No score was produced here, no archive was fetched and no trial was")
          print("activated. FINGERCELL_PREFLIGHT_INCOMPLETE is not a verdict about")
          print("FingerCell: it says a local action this project can perform has not")
          print("been performed yet. Stage 13B stays closed, and the Algorithm 5")
          print("search is NOT reopened, because nothing has been decided.")
          PY
