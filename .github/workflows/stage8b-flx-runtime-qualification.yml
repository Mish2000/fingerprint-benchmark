name: Stage 8B flx runtime qualification

# The contract suite and the evidence gate both run without torch, without the
# checkpoint and without the network. Executing the route needs a bundle that
# cannot exist in CI — the weights are not redistributable (docs/adr/0068) — so
# the flx_runtime suite is deliberately not run here and is not silently
# reported as passing either.

on:
  push:
    paths:
      - "configs/flx/**"
      - "integrations/flx/**"
      - "src/fpbench/core/flx_models.py"
      - "src/fpbench/core/flx_errors.py"
      - "src/fpbench/flx/**"
      - "src/fpbench/storage/flx_store.py"
      - "src/fpbench/experiments/stage8b_flx_runtime_qualification.py"
      - "evidence/stage8b-flx-runtime-qualification/**"
      - "tests/**stage8b**"
      - "tests/flxworld.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/stage8b-flx-runtime-qualification.yml"
  pull_request:
    paths:
      - "configs/flx/**"
      - "integrations/flx/**"
      - "src/fpbench/core/flx_models.py"
      - "src/fpbench/core/flx_errors.py"
      - "src/fpbench/flx/**"
      - "src/fpbench/storage/flx_store.py"
      - "src/fpbench/experiments/stage8b_flx_runtime_qualification.py"
      - "evidence/stage8b-flx-runtime-qualification/**"
      - "tests/**stage8b**"
      - "tests/flxworld.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/stage8b-flx-runtime-qualification.yml"

permissions:
  contents: read

jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Frozen protocol, gates, negative cases and tampering
        run: pytest -m "stage8b_contract" -q
      - name: Committed evidence gate
        run: pytest -m "stage8b" -q
      - name: The route stays out of the dataset and the prior results
        run: python -m fpbench.experiments.stage8b_flx_runtime_qualification verify
      - name: No ML runtime was needed to get here
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("torch", "torchvision"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed"
          print("verified without torch")
          PY
