name: Stage 8C flx canonical_500 raw run

# What this workflow proves, and what it deliberately does not.
#
# It runs the frozen Stage 8C protocol — identities, strict configuration, the
# adapter contract, the Decimal rule, the failure taxonomy, the alignment model,
# the finalization model and the negative cases — and, once the evidence is
# published, the evidence-only verification of it. All of that runs without
# torch, without the 875 MB checkpoint, without SD300 and without a workspace.
#
# It does **not** run the 6,000-comparison experiment. That needs a 2.06 GB
# runtime bundle whose weights are not redistributable (docs/adr/0068), it needs
# the SD300 dataset, and it takes about two and a half hours. A green run of this
# workflow is not evidence that the algorithm was executed, and the
# evidence-only verifier says so in its own result: `algorithm_executed` is
# always false (spec sections 29 and 36).

on:
  push:
    paths:
      - "configs/algorithms/flx_deepprint_texminu_512_without_localization_v1.yaml"
      - "configs/execution/flx_canonical500_sequential_no_retry_v1.yaml"
      - "configs/experiments/flx_canonical500_full_v1.yaml"
      - "src/fpbench/experiments/flx_adapter.py"
      - "src/fpbench/experiments/flx_canonical500_full.py"
      - "src/fpbench/experiments/flx_failure_mapping.py"
      - "src/fpbench/experiments/flx_research.py"
      - "src/fpbench/experiments/flx_validation.py"
      - "src/fpbench/experiments/stage8b_binding.py"
      - "src/fpbench/experiments/stage8c_finalization.py"
      - "src/fpbench/experiments/stage8c_identity.py"
      - "src/fpbench/experiments/stage8c_verify.py"
      - "src/fpbench/experiments/canonical_run_alignment.py"
      - "evidence/flx-canonical500-raw/**"
      - "tests/**stage8c**"
      - "tests/stage8cworld.py"
      - "docs/experiments/flx-canonical500-raw.md"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/stage8c-flx-canonical500-raw.yml"
  pull_request:
    paths:
      - "configs/algorithms/flx_deepprint_texminu_512_without_localization_v1.yaml"
      - "configs/execution/flx_canonical500_sequential_no_retry_v1.yaml"
      - "configs/experiments/flx_canonical500_full_v1.yaml"
      - "src/fpbench/experiments/flx_adapter.py"
      - "src/fpbench/experiments/flx_canonical500_full.py"
      - "src/fpbench/experiments/flx_failure_mapping.py"
      - "src/fpbench/experiments/flx_research.py"
      - "src/fpbench/experiments/flx_validation.py"
      - "src/fpbench/experiments/stage8b_binding.py"
      - "src/fpbench/experiments/stage8c_finalization.py"
      - "src/fpbench/experiments/stage8c_identity.py"
      - "src/fpbench/experiments/stage8c_verify.py"
      - "src/fpbench/experiments/canonical_run_alignment.py"
      - "evidence/flx-canonical500-raw/**"
      - "tests/**stage8c**"
      - "tests/stage8cworld.py"
      - "docs/experiments/flx-canonical500-raw.md"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/stage8c-flx-canonical500-raw.yml"

permissions:
  contents: read

jobs:
  raw-run-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Frozen protocol, adapter contract, Decimal rule and negative cases
        run: pytest -m "stage8c_contract" -q

      - name: Stage 8B stays verified
        run: pytest -m "stage8b_contract or stage8b" -q

      - name: Committed Stage 8C evidence gate
        run: pytest -m "stage8c" -q

      - name: Regression suites for the prior stages
        run: |
          pytest -m "adapter_contract or nbis_contract or stage7d_contract or stage8a_contract" -q
          pytest -m "decisions or metrics or imaging or paired_evaluation" -q

      - name: The run itself was not executed here, and is not reported as passing
        run: |
          python - <<'PY'
          import importlib.util

          for name in ("torch", "torchvision"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed"
          print(
              "Stage 8C contract and evidence verified without torch, without the "
              "checkpoint, without SD300 and without a workspace."
          )
          print(
              "The 6,000-comparison run was NOT executed in CI and this job makes "
              "no claim that it was (spec sections 29 and 36)."
          )
          PY
