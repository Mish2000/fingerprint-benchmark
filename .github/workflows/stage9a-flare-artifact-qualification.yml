name: Stage 9A FLARE artifact qualification

# What this workflow proves, and what it deliberately does not.
#
# It runs the whole Stage 9A contract — the candidate identity and its four
# branches, the two upstream repositories pinned by commit, the artifact
# inventory and the Stage 8E decisions over it, the transform graph and the
# authority behind every operation in it, the paper-against-code audit, the
# score contract and the route model that exercises it, the FLARE-exact
# tracked-byte guard, and a marker that can only be READY or BLOCKED.
#
# All of it is pure Python over two pinned source trees this repository does not
# hold. There is no dataset here, no torch, no checkpoint, no CUDA, no network
# and no workspace — which is the point twice over, since this is the stage that
# says a score-affecting operation must come from an authority rather than from
# whatever happened to be installed.
#
# It fetches **nothing**. No Google Drive download, no codeload acquisition, no
# checkpoint. Acquisition is local-only under the frozen policy, and a job that
# fetched a restricted artifact would be the thing Stage 8E forbade
# (docs/adr/0083).
#
# A green tick here does not say FLARE runs. At the time of writing it says the
# opposite, precisely: the outcome is FLARE_FULL_ROUTE_BLOCKED and the blockers
# are named (docs/adr/0085).

on:
  push:
    paths:
      - "src/fpbench/core/flare_errors.py"
      - "src/fpbench/experiments/stage9a_flare_identity.py"
      - "src/fpbench/experiments/stage9a_flare_artifacts.py"
      - "src/fpbench/experiments/stage9a_flare_route.py"
      - "src/fpbench/experiments/stage9a_flare_qualification.py"
      - "src/fpbench/experiments/stage9a_flare_finalization.py"
      - "evidence/stage9a-flare-artifact-qualification/**"
      - "tests/**stage9a**"
      # Stage 9A depends on Stage 8E's policy and on nothing else of it. A
      # change to any of these changes what this stage's decisions mean, so the
      # stage is re-run rather than trusted (spec section 55).
      - "src/fpbench/third_party/**"
      - "src/fpbench/core/third_party_models.py"
      - "src/fpbench/core/third_party_errors.py"
      - "evidence/stage8e-research-only-policy/**"
      - "tests/**stage8e**"
      - "docs/adr/008[5-8]*.md"
      - "docs/algorithms/flare/**"
      - "docs/experiments/stage9a-flare-artifact-qualification.md"
      - ".github/workflows/**"
      - ".gitignore"
      - ".gitattributes"
      - "pyproject.toml"
      - "Makefile"
  pull_request:
    paths:
      - "src/fpbench/core/flare_errors.py"
      - "src/fpbench/experiments/stage9a_flare_identity.py"
      - "src/fpbench/experiments/stage9a_flare_artifacts.py"
      - "src/fpbench/experiments/stage9a_flare_route.py"
      - "src/fpbench/experiments/stage9a_flare_qualification.py"
      - "src/fpbench/experiments/stage9a_flare_finalization.py"
      - "evidence/stage9a-flare-artifact-qualification/**"
      - "tests/**stage9a**"
      - "src/fpbench/third_party/**"
      - "src/fpbench/core/third_party_models.py"
      - "src/fpbench/core/third_party_errors.py"
      - "evidence/stage8e-research-only-policy/**"
      - "tests/**stage8e**"
      - "docs/adr/008[5-8]*.md"
      - "docs/algorithms/flare/**"
      - "docs/experiments/stage9a-flare-artifact-qualification.md"
      - ".github/workflows/**"
      - ".gitignore"
      - ".gitattributes"
      - "pyproject.toml"
      - "Makefile"

permissions:
  contents: read

jobs:
  flare-artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: The frozen Stage 9A qualification contract
        run: pytest -m "stage9a_contract" -q

      - name: Committed Stage 9A evidence gate
        run: pytest -m "stage9a" -q

      - name: No FLARE byte is tracked in this public repository
        # Beside Stage 8E's generic guard rather than inside it. Stage 8E is a
        # closed stage, so its hard-coded digest registry is not extended from
        # here (spec sections 3 and 52).
        run: |
          python - <<'PY'
          from pathlib import Path

          from fpbench.experiments.stage9a_flare_qualification import (
              require_no_flare_bytes_in_git,
          )
          from fpbench.third_party import require_no_third_party_bytes_in_git

          generic = require_no_third_party_bytes_in_git(Path("."))
          exact = require_no_flare_bytes_in_git(Path("."))
          print(
              f"{generic.tracked_file_count} tracked files scanned against "
              f"{len(generic.rules)} generic rules and "
              f"{exact.known_digest_count} exact FLARE digests."
          )
          print(f"Findings: {len(generic.findings)} generic, {len(exact.findings)} exact.")
          PY

      - name: This job has no runtime and fetched nothing
        run: |
          python - <<'PY'
          import importlib.util

          for name in ("torch", "torchvision", "numpy", "scipy", "cv2", "sklearn"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed"

          from fpbench.experiments.stage9a_flare_qualification import torch_is_available
          assert torch_is_available() is False

          from pathlib import Path
          from fpbench.experiments import stage9a_flare_artifacts as artifacts

          inventory = artifacts.build_artifact_inventory(repository_root=Path("."))
          assert inventory.locally_verified_count == 0, (
              "a runner verified an artifact, which means something fetched one"
          )
          print(
              f"{inventory.required_count} artifacts described, "
              f"{inventory.locally_verified_count} present here. As intended."
          )
          PY

      - name: The Stage 9A workflow itself downloads no artifact
        # The tokens are assembled from halves rather than written out, for the
        # reason Stage 8E's finalization assembles its protected prefixes: a
        # literal here would make the check refuse the step that performs it.
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/stage9a-flare-artifact-qualification.yml"
          ).read_text(encoding="utf-8")
          body = workflow.split("jobs:", 1)[1]
          tokens = [
              "dri" + "ve.google",
              "dri" + "ve.usercontent",
              "code" + "load",
              "acquire" + "_artifact",
              "enroll" + "_artifact",
              "gd" + "own",
              "w" + "get",
              "cu" + "rl",
          ]
          found = sorted(token for token in tokens if token in body)
          assert not found, f"the Stage 9A job body names {found}"
          print(f"None of {len(tokens)} acquisition tokens appears in this job.")
          PY

      - name: No test in either Stage 9A suite is skipped
        # A suite that quietly skipped would look identical to one that passed.
        # The contract needs no artifact and no runtime; the evidence gate skips
        # only while the publication does not exist, which on a merged tree it
        # does. The artifact-present suite is deliberately not run here.
        run: |
          pytest -m "stage9a_contract or stage9a" -q -rs 2>&1 | tee /tmp/stage9a.txt
          if grep -qiE '[0-9]+ skipped' /tmp/stage9a.txt; then
            echo "the Stage 9A suites must not skip anything"
            exit 1
          fi

      - name: Stage 8E is reused unchanged
        run: |
          pytest -m "stage8e_contract or stage8e" -q
          python - <<'PY'
          from pathlib import Path

          from fpbench.experiments.stage9a_flare_artifacts import (
              require_stage8e_is_the_policy_this_reuses,
          )

          require_stage8e_is_the_policy_this_reuses(Path("."))
          print("The Stage 8E marker, purpose and policy are what Stage 9A was written against.")
          PY

      - name: Regression suites for the prior stages
        run: |
          pytest -m "stage7d_contract" -q
          pytest -m "stage8a_contract or stage8a" -q
          pytest -m "stage8b_contract or stage8b" -q
          pytest -m "stage8c_contract or stage8c" -q
          pytest -m "stage8d_contract or stage8d" -q
          pytest -m "decisions or metrics or imaging or paired_evaluation" -q
          pytest -m "(adapter_contract or nbis_contract) and not dataset" -q

      - name: The outcome, and what it does and does not say
        run: |
          python -m fpbench.experiments.stage9a_flare_finalization status
          python - <<'PY'
          print()
          print("No score was produced here and no FLARE artifact was fetched.")
          print("An outcome of FLARE_FULL_ROUTE_BLOCKED is a complete result:")
          print("it says a faithful full route could not be frozen from the")
          print("sources, and it names every reason (docs/adr/0085).")
          PY
