name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Both platforms and the whole supported Python range.
    #
    # This used to be Linux and 3.12 alone, while `requires-python` says
    # ">=3.11" and the repository is developed on Windows. Two classes of bug
    # lived in that gap and neither could be seen here:
    #
    #   * platform. Stage 18A's source fingerprint is hashed over checkout bytes,
    #     which carry CRLF on a Windows checkout with core.autocrlf=true and LF
    #     everywhere else, so the same commit had two fingerprints. Windows also
    #     enforces a 260-character path limit that the nested workspace layout
    #     reaches, and refuses to replace an open file where POSIX allows it.
    #   * version. 3.11, 3.12 and 3.13 differ in ways this code touches —
    #     `datetime.UTC`, `pathlib` internals, `zipfile` defaults.
    #
    # fail-fast is off so one red cell does not hide the others: knowing a
    # failure is Windows-only, or 3.13-only, is most of the diagnosis.
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Three exclusions:
      #   dataset     needs a local copy of NIST SD300, which is
      #               redistribution-restricted and cannot be uploaded here.
      #   sourceafis  needs a JVM and a built Java bridge; it has its own workflow
      #               (sourceafis-adapter.yml) which sets both up.
      #   full_run    executes all 6,000 comparisons and takes minutes; it has its
      #               own manually triggered workflow (full-dummy-run.yml).
      # Everything else runs against synthetic SD300-shaped fixtures built in a
      # temp directory, so this still covers the whole pipeline end to end.
      - name: Test
        run: pytest -m "not dataset and not sourceafis and not full_run"

  line-endings:
    # The fingerprint gates depend on `.gitattributes` being right, and a wrong
    # entry is invisible on the machine that wrote it — it only shows up on the
    # *other* platform, which is exactly when it is expensive. Checking it out
    # cleanly on Linux and asserting the pinned files are LF catches the mistake
    # at the commit that makes it.
    name: line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fingerprinted sources are pinned to LF
        run: pytest tests/contract/test_source_fingerprints_are_pinned.py -q
