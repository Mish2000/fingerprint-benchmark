# The paired comparison: the same 6,000 pairs, two preparation paths.
#
# Every id below is exact. There is deliberately no "latest": a comparison that
# resolved its own inputs would silently become a different comparison the next
# time either chain was re-derived, while continuing to cite the same evidence
# file (spec section 26).
#
# The canonical ids are filled in after the canonical derivation and evaluation
# have produced them, for the same reason the preparation-set id was filled in
# after the images existed: each is derived from the artefacts beneath it and
# cannot be known before them.

