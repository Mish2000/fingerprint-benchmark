# NIST Special Database 300 — releases A, B and C.
#
# The dataset root is redistribution-restricted and machine-specific, so it is
# referenced through an environment variable rather than committed:
#
#   PowerShell:  $env:FPBENCH_SD300_ROOT = "C:\fingerprint-datasets\NIST"
#   bash:        export FPBENCH_SD300_ROOT=/data/NIST
#
# The root is the directory that contains sd300a/, sd300b/ and sd300c/.

dataset:
  id: sd300
  provider: sd300
  root: ${FPBENCH_SD300_ROOT}

  options:
    image_format: png

    # Every scan reads each small PNG header. This is mandatory: validation
    # errors must be known before cohort eligibility or pair generation.

    # Effective resolutions are policy, not configuration: they live in
    # fpbench.datasets.sd300.ppi_policy so that no experiment can quietly
    # reinterpret SD300C. Only the on-disk location is configurable here.
    releases:
      SD300A:
        directory: sd300a
      SD300B:
        directory: sd300b
      SD300C:
        directory: sd300c
