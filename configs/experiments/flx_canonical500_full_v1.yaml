# Stage 8C: the qualified flx route over the canonical SD300 comparisons
# SourceAFIS and NBIS already ran.
#
# This file selects nothing. Every identifier in it names something that already
# exists and was produced by an earlier, finalised stage: the reference run, its
# plan, its result set, the immutable 500 ppi input set all three were built
# from, and the Stage 8B qualification that decided this route may be executed at
# benchmark scale at all. No cohort is chosen here, no pair is generated here,
# and no new prepared image is materialised here — Stage 8C reuses the pair
# manifest of run_4c59fa02a6ab, row for row, in its order (docs/adr/0074).
#
# There is no threshold in this file and there will not be one. The flx score is
# dot(texture) + dot(minutia) in [-2, 2] from an author-supplied implementation
# nobody has published an operating point for, and a threshold may not be chosen
# from the SD300 scores this run is about to produce. What Stage 8C publishes is
# 6,000 stored outcomes and the operational facts beside them — no distribution,
# no summary statistic, no decision (docs/adr/0076, docs/adr/0003).
#
# The execution controls are *not* the reference run's, and that is deliberate
# and checked. Everything that decides which pixels are opened is identical; the
# job deadline is new, because 60 seconds was a budget chosen for a Java matcher
# and this route spends five deadlined operations inside one job. See
# configs/execution/flx_canonical500_sequential_no_retry_v1.yaml and
# docs/adr/0074.

experiment_id: flx_canonical500_full_v1
kind: research
replicate_index: 0

dataset_config: configs/datasets/sd300.yaml
protocol_config: configs/protocols/sd300_50_subjects.yaml
algorithm_config: configs/algorithms/flx_deepprint_texminu_512_without_localization_v1.yaml

# Every participating image must carry VERIFIED checksum evidence, exactly as
# the reference run required.
require_verified_checksums: true

# ---------------------------------------------------------------------------
# The Stage 8B qualification this run is bound to.
#
# Each value is re-derived at preparation time from the published Stage 8B
# evidence and from this repository's own source, and preparation stops on any
# mismatch — before a run exists, before an image is opened. Restating them here
# is what makes the binding reviewable in a diff rather than only in code.
# ---------------------------------------------------------------------------
stage8b:
