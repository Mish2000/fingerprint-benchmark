[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpbench"
version = "0.1.0"
description = "Reproducible benchmark harness for fingerprint recognition algorithms on NIST SD300"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15",
    "PyYAML>=6",
    # The canonical-500 resampler. Pinned exactly, and pinned again in
    # requirements-imaging.lock, whose digest is part of every prepared-image
    # set's runtime identity (docs/adr/0031).
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "dataset: requires a local copy of NIST SD300 (set FPBENCH_SD300_ROOT)",
    "sourceafis: requires a built SourceAFIS Java bridge and a Java 17+ runtime",
    "full_run: executes the complete 6,000-job dummy protocol (minutes, own CI workflow)",
    "decisions: threshold application, SELF eligibility and evaluation views (no JVM, no dataset)",
    "metrics: counting decisions into rates with named denominators (no JVM, no dataset)",
    "imaging: the shared canonical image pipeline — geometry, pixels, PNG, prepared sets (no JVM, no dataset)",
    "canonical500: exercises the canonical_500 profile end to end (may also need dataset or sourceafis)",
    "paired_evaluation: comparing two finished derivations pair by pair (no JVM, no dataset)",
    "adapter_contract: what a new algorithm must satisfy to be integrable — the contract suite, the shared adapter tools, the import boundaries (no JVM unless also marked sourceafis)",
    "nbis_contract: the NBIS route's own contract — parsers, failure mapping, cleanup, timeouts, metadata, command construction, runtime drift (no NBIS, no network, no dataset)",
    "nbis_upstream: needs NIST's NBIS 5.0.0 archives or a certified build of them (set FPBENCH_NBIS_BUILD_DIR)",
    "nbis_full_run: the stage 7C workspace — the canonical 6,000 comparisons under NBIS (needs the dataset, the certified build and the finished SourceAFIS chain)",
    "upstream: needs a third-party source archive or a build of one; excluded from every no-network suite",
    "stage7d_contract: the stage 7D methodology — strict comparators, legacy profile compatibility, algorithm-neutral orchestration, cross-algorithm models, population comparability, tampering (no JVM, no NBIS, no dataset)",
    "stage7d: the stage 7D workspace — NBIS decisions, NBIS metrics and the SourceAFIS/NBIS comparison over the real 6,000 (needs the finished chains of both algorithms)",
    "stage8a_contract: artifact qualification, hard gates, immutable identities, selection policy, offline probes and tampering (no ML runtime, network, dataset, or prior results)",
    "stage8a: the committed Stage 8A modern-matcher qualification and selection evidence gate (no dataset and no prior-result workspace)",
    "stage8b_contract: the frozen Stage 8B protocol — identities, profile schemas, the transform rule, the score contract, the subprocess protocol, negative cases and tampering (no torch, no checkpoint, no network, no dataset)",
    "flx_runtime: needs the pinned flx CPU runtime bundle and the local source and checkpoint (set FPBENCH_FLX_RUNTIME and FPBENCH_FLX_ARTIFACT_ROOT)",
    "stage8b: the committed Stage 8B runtime-qualification evidence gate (no dataset and no prior-result workspace)",
    "stage8c_contract: the frozen Stage 8C protocol — identities, strict config, the 6,000-pair shape, the flx adapter contract, Decimal result semantics, alignment and finalization models, negative cases and tampering (no torch, no checkpoint, no dataset, no prior results)",
    "stage8c_full_run: the stage 8C workspace — the canonical 6,000 comparisons under flx (needs the dataset, the pinned flx bundle and the finished SourceAFIS chain)",
    "stage8c: the committed Stage 8C raw-run evidence gate (no dataset and no prior-result workspace)",
    "stage8d_contract: the generic calibration infrastructure — exact rates, observed-score boundaries, tie atomicity, development-role enforcement, protected-identity refusal, the DecisionProfile bridge, strict parsing and determinism (pure Python, synthetic fixtures, no dataset and no runtime)",
    "stage8d: the committed Stage 8D calibration-infrastructure evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage8e_contract: the repository-wide research-only third-party policy — the purpose declaration, the observation/decision split, the intersection rule, owner risk acceptance, the artifact store, the modification ladder and the public-repository guard (pure Python, synthetic notices, no dataset and no runtime)",
    "stage8e: the committed Stage 8E research-only-policy evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage9a_contract: the frozen Stage 9A FLARE qualification — the candidate identity, the two pinned upstream commits, the artifact inventory and its Stage 8E decisions, the transform graph and its authorities, the paper-against-code audit, the score contract and its route model, the FLARE-exact byte guard and the two-outcome marker (pure Python, synthetic vectors, no torch, no checkpoint, no network and no dataset)",
    "stage9a: the committed Stage 9A FLARE artifact-qualification evidence gate (no dataset, no runtime and no prior-result workspace)",
    "flare_artifact: needs the FLARE and FLARE_ENH artifacts in the local third-party store, and a torch that can open them (set FPBENCH_THIRD_PARTY_ROOT)",
    "stage10a_contract: the frozen Stage 10A Algorithm 4 candidate preflight — the candidate set, the seven hard gates and their order, fail-fast and NOT_REACHED, the origin vocabulary, the input-domain rule, the refused constructions, the selection rule and the two-outcome marker (pure Python, no torch, no checkpoint, no network and no dataset)",
    "stage10a: the committed Stage 10A candidate-preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "algorithm4_preflight_artifact: needs the pinned candidate source archive in the local third-party store (set FPBENCH_THIRD_PARTY_ROOT)",
    "stage10b_contract: the frozen Stage 10B id3 Finger SDK preflight — the provisional candidate identity, the ten hard gates and their order, fail-fast and NOT_REACHED, the acquisition and licence-capacity rules, the frozen workload arithmetic, the extractor and matcher profile closure, the raw-score and SELF requirements, the secret guard and the two-outcome marker (pure Python, synthetic fixtures, no SDK, no licence, no network and no dataset)",
    "stage10b: the committed Stage 10B id3 preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "id3_artifact: needs a delivered id3 Finger SDK package and an activated licence on this machine (set FPBENCH_THIRD_PARTY_ROOT); never runs in CI",
    "stage11a_contract: the frozen Stage 11A VeriFinger 2025.2 preflight — the provisional candidate identity, the seventeen hard gates and their order, fail-fast and NOT_REACHED, the source-class rule that separates artifact evidence from web pages, the acquisition pin fields, the setting-provenance vocabulary and its one refused answer, the raw-score and SELF requirements, the secret and byte guards and the two-outcome marker (pure Python, no vendor SDK, no licence, no network and no dataset)",
    "stage11a: the committed Stage 11A VeriFinger preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage11b_contract: the frozen Stage 11B VeriFinger production integration — the production identity, the bridge wire format and its refusals, the failure classification that separates a declined print from a broken machine, the seventeen-component runtime closure and its three guards, the strict experiment config, the result-set validator, and the byte, path and credential guards (pure Python, a fake bridge, no vendor SDK, no licence, no JVM, no network and no dataset)",
    "stage11b: the committed Stage 11B VeriFinger canonical500 raw-run evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage11b_full_run: the Stage 11B workspace — the canonical 6,000 comparisons under VeriFinger (needs the dataset, the pinned SDK, an activated trial licence and the finished SourceAFIS chain)",
    "verifinger_artifact: needs the pinned VeriFinger 2025.2 artifacts in the local third-party store, and for the execution checks an activated trial licence (set FPBENCH_THIRD_PARTY_ROOT); never runs in CI",
    "stage12a_contract: the frozen Stage 12A Innovatrics IDKit preflight — the provisional candidate identity, the ten hard gates and their order, fail-fast and the pending state that is not a failure, the acquisition state machine and its two refusal states, the single-finger rule against consolidated multi-finger scores, the raw-score requirement and the refused threshold workaround, the setting-provenance vocabulary, the frozen pair binding, the qualification harness proved against a fake SDK, the secret and byte guards and the two-outcome marker (pure Python, synthetic fixtures, no vendor SDK, no licence, no network and no dataset)",
    "stage12a: the committed Stage 12A IDKit preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage13a_contract: the frozen Stage 13A Neurotechnology FingerCell 3.3 preflight — the candidate identity, the ten hard gates and their order, the four gate states and the ACTION_REQUIRED/FAIL split that separates work nobody has done from findings about the candidate, the artifact acquisition manifest and its digest rules, the same-vendor contamination guard, the canonical500 route and the refused embedded sample size, the single-finger proprietary template rule against merging and caching, the native raw integer score contract, the settings closure and its non-exhaustive list, the frozen pair binding taken from the API under test, the four mandatory failure probes, the qualification harness proved against a fake SDK, the secret and byte guards and the two-outcome marker (pure Python, synthetic fixtures, no vendor SDK, no licence, no network and no dataset)",
    "stage13a: the committed Stage 13A FingerCell preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage14a_contract: the frozen Stage 14A Griaule GBS Fingerprint SDK artifact/route preflight — the candidate identity and its unresolved-until-package version, the four gates and their order, the five gate states and the PENDING_ACCESS/ACTION_REQUIRED/FAIL split that keeps a wait on the vendor, a chore of our own and a finding about the candidate apart, the acquisition state machine and its walked-route table, the refused mirror, catalogue, reseller and licence-bypass sources, the canonical500 input rule and its vendor-internal-crop exception, the raw 1:1 score requirement against a thresholded-only decision, the settings closure that can never be empty, the secret and byte guards and the two-outcome marker (pure Python, no vendor SDK, no licence, no network and no dataset)",
    "stage14a: the committed Stage 14A Griaule preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "griaule_artifact: needs a delivered Griaule GBS Fingerprint SDK package in the local artifact store (set FPBENCH_THIRD_PARTY_ROOT); never runs in public CI",
    "fingercell_artifact: needs the delivered FingerCell trial archive in the local artifact store (set FPBENCH_THIRD_PARTY_ROOT); never runs in public CI",
    "idkit_artifact: needs a delivered Innovatrics IDKit package and an activated licence on this machine (set FPBENCH_THIRD_PARTY_ROOT); never runs in CI",
    "stage15a_contract: the frozen Stage 15A fingerprints-matching qualification — the candidate identity and its two published digests, the six gates and their order, the selection policy that made self-service acquisition a hard requirement and the refusal to give Stage 14A a final outcome it does not have, the upstream route contract parsed from the installed module rather than from the README, the argument binding that follows from normalising by len(minutiae1), the determinism requirement and the deliberate absence of a symmetry requirement, the failure contract that maps an upstream refusal to an algorithmic failure and never to a score of zero, the OpenCV pin as part of algorithm identity, the strict experiment config, the result-set validator, and the finalization that refuses a marker over a result set carrying no score (pure Python, a fake bridge, no package, no OpenCV, no network and no dataset)",
    "stage15a: the committed Stage 15A fingerprints-matching evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage15a_full_run: the Stage 15A workspace — the canonical 6,000 comparisons under fingerprints-matching (needs the dataset manifests, the frozen runtime and the finished SourceAFIS chain)",
    "fingerprints_matching_artifact: needs the pinned fingerprints-matching artifacts and the frozen runtime in the local third-party store (set FPBENCH_THIRD_PARTY_ROOT); never runs in CI",
    "stage16a_contract: the frozen Stage 16A FingerFlow qualification — the candidate identity and its pinned commit, the nine checkpoint digests and the dead-mirror rule, the seven gates and fail-fast, the four route authorities and the one that fails, the refusal to break a route tie by experiment, the explicit-refusal against unhandled-exception split, the predecessor record that cites a mechanism and never a score, the retired at-least-one-score criterion, and a marker that cannot establish Algorithm 5 over an unclosed route (pure Python, no package, no TensorFlow, no checkpoint, no network and no dataset)",
    "stage16a: the committed Stage 16A FingerFlow evidence gate (no dataset, no runtime and no prior-result workspace)",
    "fingerflow_artifact: needs the pinned FingerFlow distributions, the nine published checkpoints and the pinned upstream sources in the local third-party store (set FPBENCH_THIRD_PARTY_ROOT); never runs in CI",
    "stage17a_contract: the frozen Stage 17A fingerprintMatcher qualification — the candidate identity and its two published digests, the rule that the distribution rather than the repository is the authority, the seven gates and the one that decides them, and the score-contract parser exercised against synthetic modules that print, return, and return-a-decision (pure Python, no package, no OpenCV, no network and no dataset)",
    "stage17a: the committed Stage 17A fingerprintMatcher evidence gate (no dataset, no runtime and no prior-result workspace)",
    "fingerprintmatcher_artifact: needs the two pinned fingerprintMatcher distributions in the local third-party store (set FPBENCH_THIRD_PARTY_ROOT)",
    "stage18a_contract: the frozen Stage 18A SecuGen→OpenAFIS private reference protocol — the execution-first purpose that never claims Algorithm 5, the pinned OpenAFIS commit and its raw uint8 score contract with no transform and no threshold, the deliberately distorting 300×400 route kept because it is the author's and not ours, the closed seven-status failure list and the split that keeps a failure from ever being stored as a zero and a zero from ever being stored as a failure, the arithmetic completion criterion with no minimum coverage, and a diagnostic report with no field for TAR/FAR/FMR/EER and no parameter for a threshold (pure Python, a fake matcher, no SecuGen SDK, no OpenAFIS build, no network and no dataset)",
    "stage18a: the committed Stage 18A SecuGen→OpenAFIS private reference evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage18a_private_run: the Stage 18A private reference run — 3,000 SecuGen templates and the 6,000 canonical comparisons under OpenAFIS (needs the official FDx SDK Pro package, a built OpenAFIS bridge and the prepared image set); never runs in CI",
    "openafis_artifact: needs the pinned OpenAFIS checkout and a built raw 1:1 bridge in the local third-party store (set FPBENCH_OPENAFIS_SOURCE); never runs in public CI",
    "stage19a_contract: the frozen Stage 19A MINDTCT→OpenAFIS translation contract — the angle convention derived from NBIS xytreps.c and OpenAFIS TripletScalar.cpp with no inversion and no rotation, exact unscaled coordinates against a header carrying the real raster size, the constant non-score-bearing minutia type, quality dropped rather than used to filter, MINDTCT ordering preserved with no sort or dedup, OpenAFIS's own 2..128 bounds enforced as refusals and never as a top-N truncation, and section 17's closed failure vocabulary (pure Python, no NBIS build, no OpenAFIS binary and no dataset)",
    "stage19a: the committed Stage 19A MINDTCT→OpenAFIS evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage19a_full_run: the Stage 19A workspace — the canonical 6,000 comparisons under MINDTCT→OpenAFIS (needs the certified NBIS build, a built OpenAFIS bridge and the prepared image set); never runs in CI",
]
