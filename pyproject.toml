[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpbench"
version = "0.1.0"
description = "Reproducible benchmark harness for fingerprint recognition algorithms on NIST SD300"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15",
    "PyYAML>=6",
    # The canonical-500 resampler. Pinned exactly, and pinned again in
    # requirements-imaging.lock, whose digest is part of every prepared-image
    # set's runtime identity (docs/adr/0031).
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "dataset: requires a local copy of NIST SD300 (set FPBENCH_SD300_ROOT)",
    "sourceafis: requires a built SourceAFIS Java bridge and a Java 17+ runtime",
    "full_run: executes the complete 6,000-job dummy protocol (minutes, own CI workflow)",
    "decisions: threshold application, SELF eligibility and evaluation views (no JVM, no dataset)",
    "metrics: counting decisions into rates with named denominators (no JVM, no dataset)",
    "imaging: the shared canonical image pipeline — geometry, pixels, PNG, prepared sets (no JVM, no dataset)",
    "canonical500: exercises the canonical_500 profile end to end (may also need dataset or sourceafis)",
    "paired_evaluation: comparing two finished derivations pair by pair (no JVM, no dataset)",
    "adapter_contract: what a new algorithm must satisfy to be integrable — the contract suite, the shared adapter tools, the import boundaries (no JVM unless also marked sourceafis)",
    "nbis_contract: the NBIS route's own contract — parsers, failure mapping, cleanup, timeouts, metadata, command construction, runtime drift (no NBIS, no network, no dataset)",
    "nbis_upstream: needs NIST's NBIS 5.0.0 archives or a certified build of them (set FPBENCH_NBIS_BUILD_DIR)",
    "nbis_full_run: the stage 7C workspace — the canonical 6,000 comparisons under NBIS (needs the dataset, the certified build and the finished SourceAFIS chain)",
    "upstream: needs a third-party source archive or a build of one; excluded from every no-network suite",
    "stage7d_contract: the stage 7D methodology — strict comparators, legacy profile compatibility, algorithm-neutral orchestration, cross-algorithm models, population comparability, tampering (no JVM, no NBIS, no dataset)",
    "stage7d: the stage 7D workspace — NBIS decisions, NBIS metrics and the SourceAFIS/NBIS comparison over the real 6,000 (needs the finished chains of both algorithms)",
    "stage8a_contract: artifact qualification, hard gates, immutable identities, selection policy, offline probes and tampering (no ML runtime, network, dataset, or prior results)",
    "stage8a: the committed Stage 8A modern-matcher qualification and selection evidence gate (no dataset and no prior-result workspace)",
    "stage8b_contract: the frozen Stage 8B protocol — identities, profile schemas, the transform rule, the score contract, the subprocess protocol, negative cases and tampering (no torch, no checkpoint, no network, no dataset)",
    "flx_runtime: needs the pinned flx CPU runtime bundle and the local source and checkpoint (set FPBENCH_FLX_RUNTIME and FPBENCH_FLX_ARTIFACT_ROOT)",
    "stage8b: the committed Stage 8B runtime-qualification evidence gate (no dataset and no prior-result workspace)",
    "stage8c_contract: the frozen Stage 8C protocol — identities, strict config, the 6,000-pair shape, the flx adapter contract, Decimal result semantics, alignment and finalization models, negative cases and tampering (no torch, no checkpoint, no dataset, no prior results)",
    "stage8c_full_run: the stage 8C workspace — the canonical 6,000 comparisons under flx (needs the dataset, the pinned flx bundle and the finished SourceAFIS chain)",
    "stage8c: the committed Stage 8C raw-run evidence gate (no dataset and no prior-result workspace)",
    "stage8d_contract: the generic calibration infrastructure — exact rates, observed-score boundaries, tie atomicity, development-role enforcement, protected-identity refusal, the DecisionProfile bridge, strict parsing and determinism (pure Python, synthetic fixtures, no dataset and no runtime)",
    "stage8d: the committed Stage 8D calibration-infrastructure evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage8e_contract: the repository-wide research-only third-party policy — the purpose declaration, the observation/decision split, the intersection rule, owner risk acceptance, the artifact store, the modification ladder and the public-repository guard (pure Python, synthetic notices, no dataset and no runtime)",
    "stage8e: the committed Stage 8E research-only-policy evidence gate (no dataset, no runtime and no prior-result workspace)",
    "stage9a_contract: the frozen Stage 9A FLARE qualification — the candidate identity, the two pinned upstream commits, the artifact inventory and its Stage 8E decisions, the transform graph and its authorities, the paper-against-code audit, the score contract and its route model, the FLARE-exact byte guard and the two-outcome marker (pure Python, synthetic vectors, no torch, no checkpoint, no network and no dataset)",
    "stage9a: the committed Stage 9A FLARE artifact-qualification evidence gate (no dataset, no runtime and no prior-result workspace)",
    "flare_artifact: needs the FLARE and FLARE_ENH artifacts in the local third-party store, and a torch that can open them (set FPBENCH_THIRD_PARTY_ROOT)",
    "stage10a_contract: the frozen Stage 10A Algorithm 4 candidate preflight — the candidate set, the seven hard gates and their order, fail-fast and NOT_REACHED, the origin vocabulary, the input-domain rule, the refused constructions, the selection rule and the two-outcome marker (pure Python, no torch, no checkpoint, no network and no dataset)",
    "stage10a: the committed Stage 10A candidate-preflight evidence gate (no dataset, no runtime and no prior-result workspace)",
    "algorithm4_preflight_artifact: needs the pinned candidate source archive in the local third-party store (set FPBENCH_THIRD_PARTY_ROOT)",
]
